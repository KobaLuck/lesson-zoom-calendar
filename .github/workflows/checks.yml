name: Desktop compatibility
on:
  push:
  pull_request:
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tests/test_mac.py
      - run: python tests/test_platforms.py
      - run: node tests/test_template.mjs
